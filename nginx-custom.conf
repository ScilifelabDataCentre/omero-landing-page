# Serve static site built into /usr/share/nginx/html, listen on 8080
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Keep redirects relative (useful behind proxies)
    absolute_redirect off;

    # Basic security header
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Custom 404 fallback (overwrite as needed)
    error_page 404 /404.html;
    location = /404.html {
        try_files /404.html =404;
    }

    location / {
        try_files $uri $uri/ /404.html;
    }

    # Optional: disable logging of health checks if you want
}