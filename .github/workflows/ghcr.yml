name: Build and push docker image to the GitHub Container Registry
on:
  push:
    # Branch to be used in development
    branches:
      - main 
    paths-ignore:
      - 'README.md'
  
  # Triggered when a release is published
  release:
    types: [published]

  # workflow_dispatch can be used on feature branch to test the site
  # Or fix a bug on a release branch
  workflow_dispatch:
    inputs:
      docker_tag:
        description: 'Docker image tag (default: full commit hash)'
        required: false

jobs:
  push-to-container-registry:
    if: github.repository == 'ScilifelabDataCentre/omero-landing-page'  
    name: Build and push image to the GitHub Container Registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - dockerfile: Dockerfile
            images: ghcr.io/scilifelabdatacentre/omero-landing-page

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Docker Meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.images }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          push: ${{ github.event_name != 'pull_request' }}
          context: .
          file: ./${{ matrix.dockerfile }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            HUGO_ENV_ARG=${{ github.event_name == 'release' && 'production'
                  || github.ref_name == 'main' && 'production'
                  || 'development' }}          